name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Lint, Type-Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Prisma generate doesn't need a real DB, but a placeholder URL avoids warnings
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true   # ~88 pre-existing lint errors in unrelated files; gating tightens once cleaned up

      - name: Unit tests
        run: npm run test:run

  e2e:
    name: Storefront E2E (non-blocking)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true   # Advisory until the suite has a green track record; it never blocks a merge

    # Hermetic: Playwright starts the Storefront API mock (tests/e2e/mock/storefront-mock.mjs)
    # and points the dev server at it, so no Shopify secrets are needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Prisma generate doesn't need a real DB, but a placeholder URL avoids warnings
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Storefront e2e (mock-backed)
        run: npm run test:e2e
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
