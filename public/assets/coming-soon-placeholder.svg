<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9333ea"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Border accent -->
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="url(#accent)" stroke-width="2" rx="8"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="600" height="600" fill="url(#grid)"/>
  
  <!-- Hanger icon -->
  <g transform="translate(300, 200)" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round">
    <path d="M0,-40 L0,-20 C0,-10 10,0 0,0"/>
    <path d="M-80,60 L0,0 L80,60"/>
    <line x1="-80" y1="60" x2="80" y2="60"/>
  </g>
  
  <!-- COMING SOON text -->
  <text x="300" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle" letter-spacing="4">COMING</text>
  <text x="300" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle" letter-spacing="4">SOON</text>
  
  <!-- Accent line -->
  <rect x="200" y="420" width="200" height="3" fill="url(#accent)" rx="1"/>
  
  <!-- Subtext -->
  <text x="300" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="2">HEAD OVER FEELS</text>
</svg>
